                                    { name: "100m Sled Push (light)", details: "(focus on form)" },
                                    { name: "1k Ski Erg", details: "(easy pace, focus on technique)" },
                                    { name: "15 min Run", details: "(easy pace)" }
                                ]
                            },
                            {
                                type: "cooldown",
                                title: "Cooldown",
                                items: [
                                    "10 min easy walk",
                                    "Full body gentle stretching – 5-10 min."
                                ]
                            }
                        ]
                    },
                    {
                        id: "day5",
                        title: "Day 5 – Mobility & Core Stability",
                        focus: "Core Strength, Spinal Health & Injury Prevention",
                        introduction: "A dedicated session for core stability, mobility, and targeting smaller muscle groups to enhance overall stability and prevent imbalances.",
                        sections: [
                            {
                                type: "warmUp",
                                title: "Warm-Up (5-10 min)",
                                items: ["Gentle cat-cow, bird-dog, thread the needle, hip circles."]
                            },
                            {
                                type: "mainSet",
                                title: "Main Set – Core & Mobility Circuit (3-4 Rounds)",
                                details: "Perform with control, focus on engaging the right muscles. Rest 60-90 sec between rounds.",
                                exercises: [
                                    { name: "Dead Bug with Kettlebell/Dumbbell Pullover", details: "10/side (controlled movement, core braced)" },
                                    { name: "Side Plank with Hip Abduction", details: "30-45 sec/side" },
                                    { name: "Reverse Hyper (or Stability Ball Reverse Extension)", details: "15-20 reps" },
                                    { name: "Turkish Get-Up (light KB/DB or bodyweight)", details: "3/side (focus on perfect form)" },
                                    { name: "Scapular Pull-Aparts (banded)", details: "20-25 reps" }
                                ]
                            },
                            {
                                type: "cooldown",
                                title: "Cooldown",
                                items: [
                                    "5 min easy bike (flush)",
                                    "Diaphragmatic Breathing – 5 min",
                                    "Full body mobility flow – 5 min."
                                ]
                            }
                        ]
                    }
                ]
            }
        ];

        // JavaScript for navigation and rendering
        let currentWeekIndex = 0;
        let currentDayIndex = 0;

        const weekNavigation = document.getElementById('week-navigation');
        const dayNavigation = document.getElementById('day-navigation');
        const dayDetailSection = document.getElementById('day-detail-section');

        function generateWeekNavigation() {
            weekNavigation.innerHTML = '';
            programWeeks.forEach((week, index) => {
                const button = document.createElement('button');
                button.textContent = week.title;
                button.className = `px-4 py-2 rounded-lg font-medium transition-colors duration-200 ${index === currentWeekIndex ? 'bg-blue-600 text-white shadow-md' : 'bg-gray-200 text-gray-700 hover:bg-gray-300'}`;
                button.onclick = () => {
                    currentWeekIndex = index;
                    currentDayIndex = 0; // Reset to Day 1 when changing week
                    generateWeekNavigation();
                    generateDayNavigation(currentWeekIndex);
                    renderDayDetails(currentWeekIndex, currentDayIndex);
                };
                weekNavigation.appendChild(button);
            });
        }

        function generateDayNavigation(weekIndex) {
            dayNavigation.innerHTML = '';
            programWeeks[weekIndex].days.forEach((day, index) => {
                const button = document.createElement('button');
                button.textContent = day.title.split('–')[0].trim(); // Display "Day 1", "Day 2" etc.
                button.className = `px-4 py-2 rounded-lg font-medium transition-colors duration-200 ${index === currentDayIndex ? 'bg-green-600 text-white shadow-md' : 'bg-gray-200 text-gray-700 hover:bg-gray-300'}`;
                button.onclick = () => {
                    currentDayIndex = index;
                    generateDayNavigation(currentWeekIndex);
                    renderDayDetails(currentWeekIndex, currentDayIndex);
                };
                dayNavigation.appendChild(button);
            });
        }

        function renderDayDetails(weekIndex, dayIndex) {
            const week = programWeeks[weekIndex];
            const day = week.days[dayIndex];

            let html = `
                <h2 class="text-2xl font-bold text-gray-900 mb-4">${day.title}</h2>
                <p class="text-lg font-semibold text-blue-700 mb-2">Focus: ${day.focus}</p>
                <p class="text-gray-700 mb-6">${day.introduction}</p>
            `;

            let workoutBlocksHtml = '';
            day.sections.forEach((section, index) => {
                const letter = getAlphabetLetter(index);
                let sectionContentHtml = '';

                if (section.items) { // For Warm-Up, Conditioning (items list)
                    sectionContentHtml = `<ul>` + section.items.map(item => `<li>${item}</li>`).join('') + `</ul>`;
                } else if (section.exercises) { // For Strength, Accessory, Main Set (exercises list)
                    sectionContentHtml = `<ul>` + section.exercises.map(ex => `
                        <li>
                            <strong>${ex.name}</strong>
                            <p class="details">${ex.details.replace(/\\n/g, '<br>')}</p>
                        </li>`).join('') + `</ul>`;
                }

                if (section.details) { // Add extra details like rest times or pacing notes
                    sectionContentHtml += `<p class="details mt-2"><em>${section.details.replace(/\\n/g, '<br>')}</em></p>`;
                }

                workoutBlocksHtml += createMarchonWorkoutBlock(letter, section.title, sectionContentHtml);
            });

            dayDetailSection.innerHTML = html + workoutBlocksHtml;
            addAccordionListeners();
        }

        // Initialize the app
        generateWeekNavigation();
        generateDayNavigation(currentWeekIndex); // Generate day buttons for the current week
        renderDayDetails(currentWeekIndex, currentDayIndex); // Render Day 1 of the current week by default
    </script>
</body>
</html>
